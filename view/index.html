<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CAD part viewer</title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f4f2; --fg: #1b1b1a; --muted: #6b6b66; --rule: #d6d6d0; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ededea; --muted: #9a9a94; --rule: #33332f; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
      #wrap { display: flex; flex-direction: column; height: 100%; min-height: 360px; }
      header { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
      header .meta { color: var(--muted); font-family: ui-monospace, monospace; }
      #stage { flex: 1; position: relative; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="wrap">
      <header><strong id="name">Waiting for a part…</strong><span class="meta" id="meta"></span></header>
      <div id="stage"><div id="status">Loading</div></div>
    </div>
    <!--VIEW_SCRIPT-->
  </body>
</html>
